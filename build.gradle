buildscript {
    ext.applicationNamespace = "com.google.android.gms"
    ext.basePackageName = "app.revanced"

    ext.cronetVersion = '102.5005.125'
    ext.wearableVersion = '0.1.1'

    ext.kotlinVersion = '2.4.10'
    ext.coroutineVersion = '1.7.3'

    ext.annotationVersion = '1.7.1'
    ext.appcompatVersion = '1.6.1'
    ext.biometricVersion = '1.1.0'
    ext.coreVersion = '1.12.0'
    ext.credentialsVersion = '1.2.0'
    ext.fragmentVersion = '1.6.2'
    ext.lifecycleVersion = '2.7.0'
    ext.loaderVersion = '1.1.0'
    ext.materialVersion = '1.14.0-alpha08'
    ext.mediarouterVersion = '1.6.0'
    ext.multidexVersion = '2.0.1'
    ext.navigationVersion = '2.7.7'
    ext.preferenceVersion = '1.2.0'
    ext.recyclerviewVersion = '1.3.2'
    ext.webkitVersion = '1.10.0'
    ext.workVersion = '2.7.0'

    ext.slf4jVersion = '1.7.36'
    ext.volleyVersion = '1.2.1'
    ext.okHttpVersion = '4.12.0'
    ext.ktorVersion = '2.3.13'
    ext.wireVersion = '6.4.6'
    ext.tinkVersion = '1.13.0'
    ext.guavaVersion = '33.5.0-android'

    ext.androidBuildGradleVersion = '8.13.2'

    ext.androidBuildVersionTools = '35.0.0'

    ext.androidMinSdk = 21
    ext.androidTargetSdk = 34
    ext.androidCompileSdk = 36

    ext.localProperties = new Properties()

    try {
        var stream = rootProject.file('local.properties').newDataInputStream()
        ext.localProperties.load(stream)
        stream.close()
    } catch (ignored) {
        // Ignore
    }

    ext.hasModule = (String name, boolean enabledByDefault) -> {
        return ext.localProperties.getProperty("modules." + name, enabledByDefault.toString()).toBoolean()
    }

    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$androidBuildGradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"
        classpath "com.squareup.wire:wire-gradle-plugin:$wireVersion"
    }
}

// RE specific version name and code
def ourGmsVersionCode = 255070225
def ourGmsVersionName = "7.2.2"
def ourVendingVersionCode = ourGmsVersionCode
def ourVendingVersionName = ourGmsVersionName

logger.lifecycle('Starting build for GMS version {} ({})...', ourGmsVersionName, ourGmsVersionCode)

allprojects {
    apply plugin: 'idea'

    group = providers.gradleProperty('group').getOrElse('com.github.Nich87.MicroG-RE')
    version = providers.gradleProperty('version').getOrElse('7.2.2-npatch2')
    ext.vendingAppVersionName = ourVendingVersionName
    ext.vendingAppVersionCode = ourVendingVersionCode
    ext.appVersionCode = ourGmsVersionCode
    ext.isReleaseVersion = false
}

subprojects {
    repositories {
        mavenCentral()
        google()
        maven {url 'https://developer.huawei.com/repo/'}
    }
}

configure([project(':play-services-core-proto'), project(':safe-parcel-processor')]) {
    apply plugin: 'maven-publish'
    plugins.withId('java') {
        java.withSourcesJar()
    }
    afterEvaluate {
        publishing {
            publications {
                release(MavenPublication) {
                    from components.java
                }
            }
        }
    }
}
